<script>
// ===== 화면에 에러 표시 (아이패드 콘솔 대용) =====
window.onerror = function (msg, src, line) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#c00;color:#fff;padding:8px;font-size:14px;z-index:9999;';
  d.textContent = '⚠ ' + msg + ' (line ' + line + ')';
  document.body.appendChild(d);
};

const gridWidth = 12;
const gridHeight = 12;
const totalCells = gridWidth * gridHeight;

let board, revealed, wordMap, foundWords, currentPlayer, foundBy, words, usedIndexes;
let clovers = new Set(), daisies = new Set(), resultShown = false, gameStarted = false;
let player1 = "초록", player2 = "분홍", currentPlayerName = "";
let lastIndex = null;

const gameEl = document.getElementById('game');
const player1ScoreEl = document.getElementById('player1Score');
const player2ScoreEl = document.getElementById('player2Score');
const player1ScoreMobileEl = document.getElementById('player1Score-mobile');
const player2ScoreMobileEl = document.getElementById('player2Score-mobile');
const retryBtn = document.getElementById('retryBtn');
const currentTurnEl = document.getElementById('currentTurn');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function getRandomSample(arr, count) {
  if (count >= arr.length) return [...arr];
  const shuffled = [...arr];
  shuffle(shuffled);
  return shuffled.slice(0, count);
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const poolFile = urlParams.get('pool');

  if (!poolFile) {
    words = ['계륵', '각골난망', '각주구검', '거두절미', '개과천선', '감지덕지', '감언이설', '결초보은', '경천동지', '견물생심', '견원지간', '결자해지', '소문만복래'];
    startGame();
    return;
  }

  fetch('wordpools/' + poolFile + '.json')
    .then(res => res.json())
    .then(data => {
      document.getElementById('game-title').textContent = data.title || '워퍼즈 메이트';
      const rawText = data.description || '';
      document.getElementById('game-desc').innerHTML = rawText.replace(/\n/g, '<br>');

      words = [];
      for (let length in data.words) {
        const count = data.wordCount[length] || 0;
        words.push(...getRandomSample(data.words[length], count));
      }
      startGame();
    })
    .catch(err => {
      document.body.innerHTML = '<p>❌ 워드풀 로딩 중 오류 발생: ' + err.message + '</p>';
    });
};

function startGame() {
  gameStarted = true;
  init();
}

function init() {
  board = Array(totalCells).fill(null);
  revealed = Array(totalCells).fill(false);
  wordMap = {};
  foundWords = new Set();
  foundBy = { player1: [], player2: [] };
  currentPlayer = 'player1';
  usedIndexes = new Set();
  clovers.clear();
  daisies.clear();
  resultShown = false;

  gameEl.innerHTML = '';
  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.onclick = () => { if (!resultShown) handleClick(i); };
    gameEl.appendChild(cell);
  }

  if (!placeAllWordsWithVariety()) {
    shuffle(words);
    for (let word of words) {
      for (let attempt = 0; attempt < 500; attempt++) {
        if (placeWord(word)) break;
      }
    }
  }

  placeDaisies(14);
  placeClovers(14);
  fillEmptyCells();
  updateScore();
  updateTurnDisplay();
  checkGameEnd();
}

function canPlaceWord(word, x, y, dx, dy) {
  for (let i = 0; i < word.length; i++) {
    let nx = x + dx * i, ny = y + dy * i;
    if (nx < 0 || ny < 0 || nx >= gridWidth || ny >= gridHeight) return false;
    let idx = ny * gridWidth + nx;
    if (board[idx] && board[idx] !== word[i]) return false;
    if (usedIndexes.has(idx)) return false;
  }
  return true;
}

function placeWord(word) {
  const directions = [{ x: 1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 }];
  const shuffledDirections = directions.sort(() => Math.random() - 0.5);

  for (let dir of shuffledDirections) {
    const startY = Math.floor(Math.random() * gridHeight);
    for (let i = 0; i < gridHeight; i++) {
      const y = (startY + i) % gridHeight;
      for (let x = 0; x < gridWidth; x++) {
        if (canPlaceWord(word, x, y, dir.x, dir.y)) {
          let positions = [];
          for (let k = 0; k < word.length; k++) {
            let nx = x + dir.x * k, ny = y + dir.y * k, idx = ny * gridWidth + nx;
            board[idx] = word[k];
            usedIndexes.add(idx);
            positions.push(idx);
          }
          wordMap[word] = { positions: positions, direction: [dir.x, dir.y] };
          return true;
        }
      }
    }
  }
  return false;
}

function checkDirectionVariety() {
  let directionCount = { '1,0': 0, '0,1': 0, '1,1': 0 };
  for (let word in wordMap) {
    const d = wordMap[word].direction;
    const key = d[0] + ',' + d[1];
    if (directionCount.hasOwnProperty(key)) directionCount[key]++;
  }
  return directionCount['1,0'] > 0 && directionCount['0,1'] > 0 && directionCount['1,1'] > 0;
}

function placeAllWordsWithVariety() {
  let attempts = 0;
  const maxAttempts = 10;
  do {
    board = Array(totalCells).fill(null);
    usedIndexes.clear();
    wordMap = {};
    let allPlaced = true;
    const shuffledWords = [...words].sort(() => Math.random() - 0.5);
    for (let word of shuffledWords) {
      if (!placeWord(word)) { allPlaced = false; break; }
    }
    if (allPlaced && checkDirectionVariety()) return true;
    attempts++;
  } while (attempts < maxAttempts);
  return false;
}

function placeSpecial(set, count) {
  let placed = 0, attempts = 0;
  while (placed < count && attempts < 1000) {
    const idx = Math.floor(Math.random() * totalCells);
    if (!usedIndexes.has(idx) && !clovers.has(idx) && !daisies.has(idx) && isSafeForSpecial(idx)) {
      set.add(idx);
      placed++;
    }
    attempts++;
  }
}
function placeClovers(count) { placeSpecial(clovers, count); }
function placeDaisies(count) { placeSpecial(daisies, count); }

function isSafeForSpecial(idx) {
  const x = idx % gridWidth;
  const y = Math.floor(idx / gridWidth);
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight) {
        const nIdx = ny * gridWidth + nx;
        if (clovers.has(nIdx) || daisies.has(nIdx)) return false;
      }
    }
  }
  return true;
}

function fillEmptyCells() {
  const filler = '같갛개거건걸것게고괴교국궁그근금기긴까깜깨꺾껴꼼꽁꾸끔난내넘넣네놀놈누뉴는니님다닥대댄더던덩데도동두드득든듣들등디딜딱때땡똑뚫뛰라락란람랐랑래랜러레려력렸로롭르른를리린림마만맛맞맨머먼멀메멘며몰무묻뭘미민바받방버벅번봐봤부붙브블비빈빌빔빠빡빨빼뻥사새생서섭섰세숙쉬슴실싶쌍쓰씌씻아악알았애야어엄업없었엉에여열옛오온올와왔왜우울원위유윤으을음의익인잃있잊작잖잘저전제져좋주줬짜짝찍차착참창채척천청체쳤초출췄취치친카켜코콜크테토트튼폭핀하학한할해햄했행현호혼화환히'.split('');
  shuffle(filler);
  let i = 0;
  for (let j = 0; j < totalCells; j++) {
    if (!board[j] && !clovers.has(j) && !daisies.has(j)) {
      board[j] = filler[i++ % filler.length];
    }
  }
}

function reveal(index) {
  if (revealed[index]) return;
  revealed[index] = true;
  const cell = gameEl.children[index];

  if (clovers.has(index)) {
    cell.innerHTML = '<span>🍀</span>';
    cell.classList.add('clover');
    const directions = [-gridWidth, gridWidth, -1, 1];
    for (let d of directions) {
      const newIdx = index + d;
      if (newIdx >= 0 && newIdx < totalCells) {
        if (d === -1 || d === 1) {
          if (Math.floor(index / gridWidth) === Math.floor(newIdx / gridWidth)) reveal(newIdx);
        } else {
          reveal(newIdx);
        }
      }
    }
  } else if (daisies.has(index)) {
    const img = document.createElement('img');
    img.src = 'daisy_64x64.png';
    img.alt = '데이지';
    img.style.width = '24px';
    img.style.height = '24px';
    cell.appendChild(img);
    cell.classList.add('daisy');
    const x = index % gridWidth;
    const y = Math.floor(index / gridWidth);
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight) {
          const nIdx = ny * gridWidth + nx;
          if (!revealed[nIdx]) reveal(nIdx);
        }
      }
    }
  } else {
    cell.textContent = board[index];
  }
  cell.classList.add('revealed');
}

function updateScore() {
  const p1HTML = `<h2>${player1}:</h2>` + foundBy.player1.map(w => `<p>${w}</p>`).join("");
  const p2HTML = `<h2>${player2}:</h2>` + foundBy.player2.map(w => `<p>${w}</p>`).join("");
  player1ScoreEl.innerHTML = p1HTML;
  player2ScoreEl.innerHTML = p2HTML;
  player1ScoreMobileEl.innerHTML = p1HTML;
  player2ScoreMobileEl.innerHTML = p2HTML;
}

function updateTurnDisplay() {
  if (!gameStarted || resultShown) return;
  currentPlayerName = currentPlayer === 'player1' ? player1 : player2;
  currentTurnEl.textContent = `${currentPlayerName} 차례예요.`;
  currentTurnEl.className = currentPlayer === 'player1' ? 'turn-player1' : 'turn-player2';
}

function switchTurn(extra) {
  if (!extra) {
    currentPlayer = currentPlayer === 'player1' ? 'player2' : 'player1';
  }
  updateTurnDisplay();
}

function handleClick(index) {
  if (revealed[index] || resultShown || !gameStarted) return;
  const extra = clovers.has(index) || daisies.has(index);

  if (lastIndex !== null) gameEl.children[lastIndex].classList.remove('last-click');
  gameEl.children[index].classList.add('last-click');
  lastIndex = index;

  reveal(index);
  checkWords();
  checkGameEnd();
  if (!resultShown) switchTurn(extra);
}

function checkWords() {
  for (let word of Object.keys(wordMap)) {
    if (foundWords.has(word)) continue;
    const pos = wordMap[word].positions;
    if (pos.every(i => revealed[i])) {
      foundWords.add(word);
      foundBy[currentPlayer].push(word);
      pos.forEach(i => {
        gameEl.children[i].classList.add(currentPlayer === 'player1' ? 'word-owned-player1' : 'word-owned-player2');
      });
      updateScore();
    }
  }
}

function checkGameEnd() {
  const totalWords = Object.keys(wordMap).length;
  if (foundWords.size >= totalWords && totalWords > 0) {
    resultShown = true;
    const p1Count = foundBy.player1.length;
    const p2Count = foundBy.player2.length;
    let winner;
    if (p1Count > p2Count) winner = `${player1} 승리!`;
    else if (p2Count > p1Count) winner = `${player2} 승리!`;
    else winner = "무승부!";
    currentTurnEl.textContent = `게임 끝! ${winner} (${player1}: ${p1Count} / ${player2}: ${p2Count})`;
    currentTurnEl.className = '';
  }
}

retryBtn.onclick = () => { if (gameStarted) init(); };
</script>
