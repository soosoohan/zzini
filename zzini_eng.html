<script>
const gridSize = 14;
const totalCells = gridSize * gridSize;

let board, revealed, wordMap, foundWords, currentPlayer, foundBy, words, usedIndexes;
let zeroDecoration = {};
let resultShown = false;

const gameEl = document.getElementById('game');
const greenScoreEl = document.getElementById('greenScore');
const pinkScoreEl = document.getElementById('pinkScore');
const greenScoreMobileEl = document.getElementById('greenScore-mobile');
const pinkScoreMobileEl = document.getElementById('pinkScore-mobile');
const retryBtn = document.getElementById('retryBtn');
const currentTurnEl = document.getElementById('currentTurn');

function startGame() {
  init();
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const poolFile = urlParams.get('pool');
  if (!poolFile) {
    words = ['CAT', 'AGE', 'AREA', 'AWAY','ALSO','BABY','ABOUT', 'ADULT', 'AGAIN','AFTER','ACROSS','ACTION','ACTRESS','ACTIVITY','AFTERNOON'];
    init();
    return;
  }

  fetch('https://soosooland.com/mineworderlarge/wordpools/' + poolFile + '.json')
    .then(res => res.json())
    .then(data => {
      document.getElementById('game-title').textContent = data.title || '마인워더';
      const rawText = data.description || '게임 설명';
      const htmlText = rawText.replace(/\n/g, '<br>');
      document.getElementById('game-desc').innerHTML = htmlText;

      words = [];
      for (let length in data.words) {
        const count = data.wordCount[length] || 0;
        words.push(...getRandomSample(data.words[length], count));
      }
      init();
    })
    .catch(err => {
      document.body.innerHTML = '<p>❌ 워드풀 로딩 중 오류 발생: ' + err.message + '</p>';
    });
};

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function getRandomSample(arr, count) {
  if (count >= arr.length) return [...arr];
  const shuffled = [...arr];
  shuffle(shuffled);
  return shuffled.slice(0, count);
}

function init() {
  board = Array(totalCells).fill(null);
  revealed = Array(totalCells).fill(false);
  wordMap = {};
  foundWords = new Set();
  foundBy = { green: [], pink: [] };
  currentPlayer = 'green';
  usedIndexes = new Set();
  zeroDecoration = {};
  resultShown = false;

  createGrid();

  if (!placeAllWordsWithVariety()) {
    const sortedWords = [...words].sort((a, b) => b.length - a.length);
    for (let word of sortedWords) {
      for (let attempt = 0; attempt < 500; attempt++) {
        if (placeWord(word)) break;
      }
    }
  }

  fillEmptyCells();
  updateScore();
  updateTurnDisplay();
  checkGameEnd();
}

function createGrid() {
  gameEl.innerHTML = '';
  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.onclick = () => { if (!resultShown) handleClick(i); };
    gameEl.appendChild(cell);
  }
}

function canPlaceWord(word, x, y, dx, dy) {
  for (let i = 0; i < word.length; i++) {
    let nx = x + dx * i, ny = y + dy * i;
    if (nx < 0 || ny < 0 || nx >= gridSize || ny >= gridSize) return false;
    let idx = ny * gridSize + nx;
    if (board[idx] && board[idx] !== word[i]) return false;
    if (usedIndexes.has(idx)) return false;
  }
  return true;
}

function getZone(x, y) {
  const zoneX = x < 6 ? 0 : 1;
  const zoneY = y < 6 ? 0 : 1;
  return zoneY * 2 + zoneX;
}

let zoneCounts = [0, 0, 0, 0];

function placeAllWordsWithVariety() {
  let attempts = 0;
  const maxAttempts = 10;
  do {
    board = Array(totalCells).fill(null);
    usedIndexes.clear();
    wordMap = {};
    zoneCounts = [0, 0, 0, 0];
    let allPlaced = true;
    const sortedWords = [...words].sort((a, b) => b.length - a.length);
    for (let word of sortedWords) {
      if (!placeWord(word)) { allPlaced = false; break; }
    }
    if (allPlaced && checkDirectionVariety()) return true;
    attempts++;
  } while (attempts < maxAttempts);
  return false;
}

function placeWord(word) {
  const directions = [{ x: 1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 }];
  const shuffledDirections = directions.sort(() => Math.random() - 0.5);
  const zoneOrder = [0, 1, 2, 3].sort((a, b) => zoneCounts[a] - zoneCounts[b]);

  for (let dir of shuffledDirections) {
    for (let zone of zoneOrder) {
      const startY = Math.floor(Math.random() * gridSize);
      const startX = Math.floor(Math.random() * gridSize);
      for (let i = 0; i < gridSize; i++) {
        const y = (startY + i) % gridSize;
        for (let j = 0; j < gridSize; j++) {
          const x = (startX + j) % gridSize;
          if (getZone(x, y) !== zone) continue;
          if (canPlaceWord(word, x, y, dir.x, dir.y)) {
            let positions = [];
            for (let i = 0; i < word.length; i++) {
              let nx = x + dir.x * i, ny = y + dir.y * i, idx = ny * gridSize + nx;
              board[idx] = word[i];
              usedIndexes.add(idx);
              positions.push(idx);
            }
            wordMap[word] = { positions: positions, direction: [dir.x, dir.y] };
            zoneCounts[getZone(x, y)]++;
            return true;
          }
        }
      }
    }
  }
  return false;
}

function checkDirectionVariety() {
  let directionCount = { '1,0': 0, '0,1': 0, '1,1': 0 };
  for (let word in wordMap) {
    const direction = wordMap[word].direction;
    const key = direction[0] + ',' + direction[1];
    if (directionCount.hasOwnProperty(key)) directionCount[key]++;
  }
  return directionCount['1,0'] > 0 && directionCount['0,1'] > 0 && directionCount['1,1'] > 0;
}

function fillEmptyCells() {
  const flip = Math.random() < 0.5 ? 0 : 1; // 판마다 클로버/데이지 시작을 랜덤으로
  for (let j = 0; j < totalCells; j++) {
    if (usedIndexes.has(j)) continue;
    const x = j % gridSize, y = Math.floor(j / gridSize);
    board[j] = 0;
    zeroDecoration[j] = ((x + y + flip) % 2 === 0) ? 'clover' : 'daisy';
  }
}

function countAdjacentLetters(idx) {
  const x = idx % gridSize, y = Math.floor(idx / gridSize);
  let count = 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
        if (usedIndexes.has(ny * gridSize + nx)) count++;
      }
    }
  }
  return count;
}

function reveal(index) {
  if (revealed[index]) return;
  revealed[index] = true;
  const cell = gameEl.children[index];

  if (usedIndexes.has(index)) {
    cell.textContent = board[index];
  } else {
    const deco = zeroDecoration[index];
    if (deco === 'clover') {
      cell.innerHTML = '<span>🍀</span>';
      cell.classList.add('clover');
    } else {
      const img = document.createElement('img');
      img.src = 'https://soosooland.com/mineworderlarge/daisy_64x64.png';
      img.alt = '데이지';
      img.style.width = '24px';
      img.style.height = '24px';
      cell.appendChild(img);
      cell.classList.add('daisy');
    }
  }
  cell.classList.add('revealed');
}

function updateScore() {
  const greenHTML = `<h2>GREEN:</h2>` + foundBy.green.map(w => `<p>${w}</p>`).join("");
  const pinkHTML = `<h2>PINK:</h2>` + foundBy.pink.map(w => `<p>${w}</p>`).join("");
  greenScoreEl.innerHTML = greenHTML;
  pinkScoreEl.innerHTML = pinkHTML;
  greenScoreMobileEl.innerHTML = greenHTML;
  pinkScoreMobileEl.innerHTML = pinkHTML;
}

function updateTurnDisplay() {
  if (resultShown) return;
  const name = currentPlayer === 'green' ? 'GREEN' : 'PINK';
  currentTurnEl.textContent = `It is ${name}'s turn.`;
  currentTurnEl.className = currentPlayer === 'green' ? 'turn-green' : 'turn-pink';
}

function switchTurn() {
  currentPlayer = currentPlayer === 'green' ? 'pink' : 'green';
  updateTurnDisplay();
}

function handleClick(index) {
  if (revealed[index] || resultShown) return;

  const isLetter = usedIndexes.has(index);
  reveal(index);
  checkWords();
  checkGameEnd();

  if (!resultShown && isLetter) switchTurn();
}

function checkWords() {
  for (let word of Object.keys(wordMap)) {
    if (foundWords.has(word)) continue;
    const pos = wordMap[word].positions;
    if (pos.every(i => revealed[i])) {
      foundWords.add(word);
      foundBy[currentPlayer].push(word);
      pos.forEach(i => {
        const cell = gameEl.children[i];
        cell.classList.add(currentPlayer === 'green' ? 'word-owned-green' : 'word-owned-pink');
      });
      updateScore();
    }
  }
}

function checkGameEnd() {
  const totalWords = Object.keys(wordMap).length;
  if (foundWords.size >= totalWords && totalWords > 0) {
    resultShown = true;
    const greenWords = foundBy.green.length;
    const pinkWords = foundBy.pink.length;

    let winner;
    if (greenWords > pinkWords) {
      winner = 'Green Wins!';
    } else if (pinkWords > greenWords) {
      winner = 'Pink Wins!';
    } else {
      winner = "It's a Draw!";
    }
    currentTurnEl.textContent = `Game Over! ${winner} (Green: ${greenWords} / Pink: ${pinkWords})`;
    currentTurnEl.className = '';
  }
}

retryBtn.onclick = () => { startGame(); };
</script>
